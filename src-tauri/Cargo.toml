[package]
name = "timequest"
version = "3.7.0"
description = "TimeQuest — 高考倒计时 · 自习推进器"
authors = ["hao"]
edition = "2021"

[lib]
name = "timequest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 构建脚本要读插件清单里的 `resources` 声明
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 0.29 shares libsqlite3-sys ^0.26 with sqlx 0.7 (0.32 pulls 0.30 and conflicts)
rusqlite = { version = "0.29", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
# Needed by session command impls (not only tests)
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "time"] }
time = "0.3"
# 教材 PDF 目录解析：目录页没有书签，只能从内容流里取文字坐标
lopdf = "0.47"
# 教材源插件按需下载 PDF：rustls 不依赖系统 OpenSSL，打包和跨平台都省事
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "charset", "http2", "system-proxy"] }

[dev-dependencies]
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
time = "0.3"
rusqlite = { version = "0.29", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
