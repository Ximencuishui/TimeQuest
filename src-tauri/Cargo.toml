[package]
name = "timequest"
version = "1.2.0"
description = "TimeQuest — 高考倒计时 · 自习推进器"
authors = ["hao"]
edition = "2021"

[lib]
name = "timequest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 0.29 shares libsqlite3-sys ^0.26 with sqlx 0.7 (0.32 pulls 0.30 and conflicts)
rusqlite = { version = "0.29", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
# Needed by session command impls (not only tests)
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
time = "0.3"

[dev-dependencies]
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
time = "0.3"
rusqlite = { version = "0.29", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
